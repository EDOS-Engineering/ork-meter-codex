[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ork-meter-codex"
version = "0.1.1"
description = "Recoverable local token optimizations and Ork Meter integration for Codex"
requires-python = ">=3.11"
dependencies = ["tiktoken==0.9.0", "keyring>=24.3.1,<26"]

[project.optional-dependencies]
test = ["aiohttp>=3.9,<4", "websockets>=14,<16"]

[project.scripts]
ork-codex = "ork_codex.cli:main"

[tool.setuptools.packages.find]
include = ["ork_codex*"]

[tool.setuptools.package-data]
ork_codex = ["data/*.gz", "data/*.txt", "data/*.md"]
