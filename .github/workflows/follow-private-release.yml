name: follow-private-release

# Starts the public release of every new private release: the private
# repository holds only a read token, so this repository follows it. Each run
# advances one step (scripts/follow_release.py): public-sync once orkmeter.com
# serves the wheel, then publish-release, starting CI on the sync pull request
# and opening an issue when a person must queue it. The production environment still gates publication.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: follow-private-release
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # start the release workflows and CI on the sync branch
      issues: write # report a release that stopped
      pull-requests: read # read the generated pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Advance the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_TOKEN: ${{ secrets.ORK_METER_READ_TOKEN }} # read-only
        run: python3 -I -B scripts/follow_release.py
