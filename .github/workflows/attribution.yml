name: attribution

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions:
  contents: read

concurrency:
  group: attribution-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit trailers and PR description
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REQUIRE_PR_BODY: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: bash .github/scripts/check-attribution.sh "$BASE" "$HEAD"
