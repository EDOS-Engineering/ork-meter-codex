name: follow-private-release

# Resumes a stopped public release by hand. The normal path needs no run of
# this workflow: deliver-release.py in the private repository starts
# public-sync once orkmeter.com serves the wheel, and the sync pull request's
# merge starts publish-release. Each run of this one advances one step
# (scripts/follow_release.py) and opens an issue when a person must act. The
# production environment still gates publication.

on:
  workflow_dispatch: # by hand only; delivery and the sync merge start each step

permissions:
  contents: read

concurrency:
  group: follow-private-release
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # start the release workflows and CI on the sync branch
      issues: write # report a release that stopped
      pull-requests: read # read the generated pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Advance the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_TOKEN: ${{ secrets.ORK_METER_READ_TOKEN }} # read-only
        run: python3 -I -B scripts/follow_release.py
